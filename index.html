<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="宿舍人生">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>宿舍人生 · 我们的四年</title>
<meta name="description" content="一部关于大学四年的互动小说。404 宿舍，四张床，三个陌生人。你的选择，会改变他们的十年。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app" data-screen="title">

  <!-- 舞台：背景插画 + 天气粒子 -->
  <div class="stage" id="stage" aria-hidden="true">
    <canvas class="bg on" id="bgA"></canvas>
    <canvas class="bg" id="bgB"></canvas>
    <canvas class="fx" id="fx"></canvas>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  <!-- 标题 -->
  <section class="screen title-screen" id="titleScreen">
    <div class="title-wrap">
      <p class="eyebrow">DORM LIFE · 一部关于四年的互动小说</p>
      <h1 class="logo">宿舍<span>人生</span></h1>
      <p class="tagline">四张床，三个陌生人，<br>和一个很长很长的夏天。</p>
      <div class="title-actions">
        <button class="btn primary" id="btnNew">推开 404 的门</button>
        <button class="btn ghost hidden" id="btnContinue">继续</button>
        <button class="btn ghost" id="btnAlbum">回忆相册</button>
      </div>
      <p class="title-meta" id="titleMeta"></p>
    </div>
    <p class="title-foot">点击、空格或回车推进剧情 · 建议戴耳机</p>
  </section>

  <!-- 入学登记 -->
  <section class="screen setup-screen hidden" id="setupScreen">
    <form class="form-card paper" id="setupForm" autocomplete="off">
      <header class="form-head">
        <p class="form-kicker">新生入学登记表</p>
        <h2>欢迎来到这所大学</h2>
        <p class="form-sub">7 号楼 · 404 室</p>
      </header>
      <label class="field">
        <span class="field-label">姓名</span>
        <input id="inName" name="name" maxlength="6" placeholder="林一" required>
      </label>
      <fieldset class="field">
        <legend class="field-label">宿舍</legend>
        <div class="seg" data-name="dorm">
          <label><input type="radio" name="dorm" value="m" checked><span>男生宿舍</span></label>
          <label><input type="radio" name="dorm" value="f"><span>女生宿舍</span></label>
        </div>
      </fieldset>
      <fieldset class="field">
        <legend class="field-label">也许会心动的那个人 <small>（只影响称呼）</small></legend>
        <div class="seg" data-name="crush">
          <label><input type="radio" name="crush" value="f" checked><span>她</span></label>
          <label><input type="radio" name="crush" value="m"><span>他</span></label>
        </div>
      </fieldset>
      <fieldset class="field">
        <legend class="field-label">家境</legend>
        <div class="seg seg-3" data-name="family">
          <label><input type="radio" name="family" value="rich"><span>宽裕</span></label>
          <label><input type="radio" name="family" value="mid" checked><span>普通</span></label>
          <label><input type="radio" name="family" value="poor"><span>拮据</span></label>
        </div>
        <p class="field-hint" id="familyHint"></p>
      </fieldset>
      <div class="form-actions">
        <button type="button" class="btn text" id="btnSetupBack">返回</button>
        <button type="submit" class="btn primary dark">报到</button>
      </div>
    </form>
  </section>

  <!-- 游戏 -->
  <section class="screen game-screen hidden" id="gameScreen">
    <header class="hud" id="hud">
      <div class="hud-left">
        <p class="hud-sem" id="hudSem">大一 · 秋</p>
        <div class="hud-stats" id="hudStats"></div>
      </div>
      <div class="hud-right">
        <button class="icon-btn" id="btnJournal" title="手账（J）" aria-label="手账"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></button>
        <button class="icon-btn" id="btnSound" title="声音（M）" aria-label="声音"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
        <button class="icon-btn" id="btnMenu" title="菜单（Esc）" aria-label="菜单"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </header>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="heading" id="heading"></div>

    <div class="choices" id="choices"></div>

    <div class="dialog" id="dialog">
      <div class="speaker" id="speaker"><i class="mono" id="speakerMono"></i><span id="speakerName"></span></div>
      <p class="line" id="line" aria-live="polite"></p>
      <span class="next" id="nextHint" aria-hidden="true"></span>
    </div>
    <div class="tap" id="tap"></div>
  </section>

  <!-- 覆盖层 -->
  <div class="overlay hidden" id="overlay"></div>

  <!-- 结局纪念册 -->
  <section class="screen yearbook hidden" id="yearbook"></section>
</div>

<script src="js/engine.js"></script>
<script src="js/story/world.js"></script>
<script src="js/story/y1.js"></script>
<script src="js/story/y2.js"></script>
<script src="js/story/y3.js"></script>
<script src="js/story/y4.js"></script>
<script src="js/story/moments.js"></script>
<script src="js/story/endings.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
